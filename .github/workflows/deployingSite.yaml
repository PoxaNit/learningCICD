
name: deploy workflow

on:

  push:

    branches: [master]

jobs:

  deployment:

    name: deployment job

    runs-on: ubuntu-latest

    env:

      CREDENTIALS: ${{ secrets.CREDENTIALS }} # contains user name and password for connection with host via ftp

    steps:


      - name: Prepare Git Enviroment

        shell: bash

        run: |
          git init
          git remote add origin https://github.com/PoxaNit/learningCICD



      - name: Run Git Pull

        shell: bash

        run: git pull origin master


      - name: Installing LFTP

        shell: bash

        run: sudo apt install lftp -y


      - name: Run Tests

        shell: bash

        run: ./test.sh


      - name: Run Build

        shell: bash

        run: [[ $? -eq 0 ]] && ./buld.sh


      - name: Deploy Project

        shell: bash

        run: [[ $? -eq 0 ]] && lftp -c "open -u ${CREDENTIALS} ftpupload.net; cd htdocs; mirror --exclude-glob .git/ -R . ."
